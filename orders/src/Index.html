<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2118; --muted:#857563; --line:#e6dccb;
  --brand:#5a3d22; --gold:#b8873b; --gold-soft:#f3e6c8;
  --ok:#2f7a4b; --ok-soft:#e3f2e8; --warn:#a8641a; --warn-soft:#fbecd7; --bad:#a33a2a; --bad-soft:#f8e1dc;
  --blue:#2d5f8a; --blue-soft:#e2edf6;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(90,61,34,.08)}
.logo{font-weight:800;font-size:22px;color:var(--brand)}
.logo small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-top:6px}
label{font-size:13px;color:var(--muted);display:block;margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--brand);color:#fff}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* shell */
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
header .logo{color:#fff;font-size:18px}
header .logo{white-space:nowrap}
header .logo small{color:var(--gold-soft);display:inline;margin:0 8px}
header .sp{flex:1}
header .who{font-size:13px;color:var(--gold-soft)}
header button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{background:none;border:0;padding:10px 14px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--gold);font-weight:700}
main{padding:20px;max-width:1280px;margin:0 auto}
h2{font-size:18px;margin:24px 0 12px}
h2:first-child{margin-top:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)} .stat.ok .n{color:var(--ok)} .stat.blue .n{color:var(--blue)}
.issue{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff9ec,#fffdf8);border:1px solid #ead7ad}
.issue .line{font-size:17px;font-weight:700}
.issue .sub{color:var(--muted);font-size:13px;margin-top:4px}
.issue .acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{background:var(--blue-soft);border:1px solid #c9dcec;color:#1e4566;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;white-space:pre-wrap}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#efe7d8;border-radius:14px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between}
.col h3 span{background:#fff;border-radius:20px;padding:0 8px;font-size:12px;color:var(--muted)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
details.ol{border-bottom:1px solid var(--line)}details.ol:last-child{border-bottom:0}
details.ol>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:8px 4px;font-size:13px}
details.ol>summary::-webkit-details-marker,details.bsum>summary::-webkit-details-marker{display:none}
details.ol>summary .n{font-weight:800;min-width:92px}details.ol>summary .c{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.ol>summary .tr{color:var(--muted);font-size:12px;white-space:nowrap}details.ol>summary .am{font-weight:800;color:var(--brand);white-space:nowrap}
details.ol[open]>summary{background:#f6f2ea;border-radius:8px}details.ol .oc{margin:6px 0 10px}
details.bsum>summary{list-style:none;cursor:pointer}details.bsum>summary .arr{float:left;color:var(--muted);transition:transform .2s}
details.bsum[open]>summary .arr{transform:rotate(-90deg)}.olist{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card)}
.sumline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sumline span{background:#f3efe7;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.oc .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.oc .m{color:var(--muted);margin-top:4px;line-height:1.6}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--gold-soft);color:var(--brand);margin-left:4px;font-weight:700}
.tag.amz{background:#232f3e;color:#ff9900}
.tag.gift{background:#f6e1ef;color:#8a2c6a}
.tag.bank{background:var(--blue-soft);color:var(--blue)}
.tag.cod{background:var(--warn-soft);color:var(--warn)}
.oc .a{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.oc .a .btn:not(.sm){flex:1}
.oc .sub2{font-size:12px;color:var(--muted);margin-top:2px}
.oc .who2{margin-top:6px;font-weight:700;color:var(--ink)}
.oc .amtrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.oc .amt{font-size:18px;font-weight:800;color:var(--brand)}
.oc .pay{font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;white-space:nowrap}
.pay.p-paid{background:var(--ok-soft);color:var(--ok)}
.pay.p-bank{background:var(--blue-soft);color:var(--blue)}
.pay.p-cod{background:var(--warn-soft);color:var(--warn)}
.pay.p-bnpl{background:#efe4f7;color:#6b3a8a}
.oc .items{margin:6px 0 0;padding:0 18px 0 0;line-height:1.7}
.oc .kvs{margin-top:6px;display:grid;gap:2px}
.oc .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.oc .kv b{color:var(--ink);font-weight:500;text-align:left;direction:ltr;unicode-bidi:plaintext}
.oc .note{margin-top:6px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 8px;font-size:12.5px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cards .oc{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;margin:0;min-width:160px}
/* tables */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f1e9da;font-size:13px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.p-new{background:var(--warn-soft);color:var(--warn)} .p-run{background:var(--blue-soft);color:var(--blue)}
.p-done{background:var(--ok-soft);color:var(--ok)} .bundle.sent{opacity:.8} .bids{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.8} .p-x{background:#eee;color:#777} .p-bad{background:var(--bad-soft);color:var(--bad)}
/* days */
.day{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.day .d{font-weight:800;font-size:16px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--brand);background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.file.off{opacity:.4;pointer-events:none}
.file.ready::before{content:'↗';font-weight:800}
.file .hint{font-weight:500;font-size:11px;color:var(--muted)}
.guide-sec{margin-bottom:16px}
.guide-sec h3{margin:0 0 8px;font-size:15px;color:var(--brand)}
.guide-sec li{margin-bottom:6px;line-height:1.7}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:20}
dialog{border:0;border-radius:16px;padding:24px;max-width:420px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(43,33,24,.4)}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:640px){main{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.stat .n{font-size:22px}.board{grid-auto-flow:row;grid-auto-columns:auto}.col{min-height:0}.emptycol{display:none}.cards{grid-template-columns:1fr}.issue{flex-direction:column;align-items:stretch}.issue .acts .btn{flex:1}.day{grid-template-columns:1fr}.filters input,.filters select{flex:1;min-width:0}table{display:block;overflow-x:auto;white-space:nowrap}h2{font-size:16px}header{padding:10px 12px;gap:8px}header .who,header .logo small{display:none}header button{padding:5px 8px;font-size:12px}nav{padding:6px 10px 0}}
</style>
</head>
<body>

<section id="login">
  <div class="login-box">
    <div class="logo">لوحة الطلبات<small>أرض الأجداد</small></div>
    <label>الإيميل</label><input id="em" type="email" autocomplete="username">
    <label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:8px" id="lbtn" onclick="doLogin()">دخول</button>
    <div style="text-align:center;margin-top:14px"><a href="#" onclick="forgot();return false" style="color:var(--brand);font-size:14px">نسيت كلمة السر؟</a></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="logo">لوحة الطلبات<small>أرض الأجداد</small></div>
    <div class="sp"></div>
    <div class="who" id="who"></div>
    <button onclick="refresh()">تحديث</button>
    <button onclick="openPw()">كلمة السر</button>
    <button onclick="logout()">خروج</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div class="loading">بحمّل...</div></main>
</section>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
var S = { token: null, data: null, tab: null, q: '', src: '' };
var MANAGER_TABS = [['home','الرئيسية'],['board','سلة'],['amz','أمازون'],['cmds','الأوامر'],['guide','الدليل'],['log','السجل']];
var PREP_TABS = [['prep','آخر تجميعات'],['bundles','كل التجميعات']];

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function day(v){if(!v)return '';var d=new Date(v);if(isNaN(d))return String(v).slice(0,10);return d.toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}
function dt(v){if(!v)return '';var d=new Date(v);if(isNaN(d))return esc(v);return d.toLocaleString('ar-EG',{timeZone:'Africa/Cairo',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function dayName(v){var d=new Date(day(v)+'T12:00:00');if(isNaN(d))return '';return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
function money(v){var n=parseFloat(v);return isNaN(n)?(v||'—'):n.toLocaleString('en-US',{maximumFractionDigits:2})+' ر.س'}

var API='https://script.google.com/macros/s/AKfycbzycQqfDITM0a4KSDHiHuP2ryKC9CvN80_K37oLAg5dTJHbxcgV74iccVng8dMOHS5m/exec';
function call(fn){var args=[].slice.call(arguments,1);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args:args})})
    .then(function(r){return r.json()})
    .then(function(j){if(j.ok)return j.result;var e=new Error(j.error);if(String(j.error).indexOf('SESSION_EXPIRED')>=0)logout(true);throw e})}

function doLogin(){
  $('lerr').textContent='';$('lbtn').disabled=true;
  call('login',$('em').value,$('pw').value).then(function(r){
    $('lbtn').disabled=false;
    if(!r.ok){$('lerr').textContent=r.msg;return}
    S.token=r.token;try{localStorage.setItem('ob_t',r.token);localStorage.setItem('ob_em',$('em').value.trim())}catch(e){}
    start(r.user);
  }).catch(function(e){$('lbtn').disabled=false;$('lerr').textContent='حصلت مشكلة: '+(e.message||e)})
}
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});

function logout(expired){if(!expired&&S.token){var t=S.token;call('logout',t).catch(function(){})}S.token=null;try{localStorage.removeItem('ob_t')}catch(e){}
  $('app').classList.add('hidden');$('login').classList.remove('hidden');if(expired)$('lerr').textContent='الجلسة خلصت، ادخل تاني'}

function start(u,d){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  var tabs=u.role==='مدير'?MANAGER_TABS:PREP_TABS;
  try{var last=sessionStorage.getItem('ob_tab');if(last&&tabs.some(function(t){return t[0]===last}))S.tab=last}catch(e){}
  if(!S.tab||!tabs.some(function(t){return t[0]===S.tab}))S.tab=tabs[0][0];
  $('nav').innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  if(d){S.data=d;$('who').textContent=d.user.name+' · '+d.user.role;render()}else refresh();
}
function go(t){S.tab=t;try{sessionStorage.setItem('ob_tab',t)}catch(e){}render()}
var _busy=false;
function refresh(silent){
  if(_busy)return;_busy=true;
  call('getData',S.token).then(function(d){_busy=false;S.data=d;$('who').textContent=d.user.name+' · '+d.user.role;
    var ae=document.activeElement;if(silent&&ae&&ae.tagName==='INPUT'&&$('main').contains(ae))return;render()})
    .catch(function(e){_busy=false;if(S.token&&!S.data)$('main').innerHTML='<div class="empty">مقدرتش أحمّل: '+esc(e.message||e)+'<br><button class="btn sm" style="margin-top:10px" onclick="refresh()">جرّب تاني</button></div>'})
}
/* تحديث تلقائي: كل 20 ثانية والصفحة قدامك، وفورًا لما ترجع للصفحة */
setInterval(function(){if(S.token&&!document.hidden&&!$('dlg').open)refresh(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.token)refresh(true)});
window.addEventListener('focus',function(){if(S.token)refresh(true)});

function render(){
  [].forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.t===S.tab)});
  var f={home:vHome,board:vBoard,amz:vAmz,bundles:vBundles,cmds:vCmds,guide:vGuide,log:vLog,prep:vPrep}[S.tab];
  $('main').innerHTML=f?f():'';
  setTimeout(prefetch,300);
}

/* ---------- helpers for orders ---------- */
function tags(o){var t='';var src=String(o['المصدر']||'');var typ=String(o['النوع']||'');
  if(src.indexOf('أمازون')>=0)t+='<span class="tag amz">أمازون</span>';
  if(typ.indexOf('إهداء')>=0)t+='<span class="tag gift">إهداء</span>';
  if(typ.indexOf('تحويل')>=0)t+='<span class="tag bank">تحويل</span>';
  if(typ.indexOf('استلام')>=0&&typ.indexOf('فرع')<0)t+='<span class="tag cod">عند الاستلام</span>';
  if(typ.indexOf('فرع')>=0)t+='<span class="tag">فرع</span>';
  return t}
function count(st){return (S.data.orders||[]).filter(function(o){return !isAmz(o)&&o['المرحلة']===st}).length}
function countA(st){return (S.data.orders||[]).filter(function(o){return isAmz(o)&&o['المرحلة']===st}).length}
function st(k){var s=S.data.state[k];return s?s.v:''}
function stT(k){var s=S.data.state[k];return s?s.t:''}

/* ---------- manager: home ---------- */
function vHome(){
  var d=S.data;var pend=(d.cmds||[]).filter(function(c){return c['الحالة']==='جديد'||c['الحالة']==='جاري'});
  var line=st('سطر الإصدار المنتظر');var issueState=st('حالة الإصدار');
  var html='';
  var cm=st('رسالة من Claude');if(cm)html+='<div class="msg"><b>من Claude:</b> '+esc(cm)+'<div style="font-size:11px;opacity:.7;margin-top:4px">'+dt(stT('رسالة من Claude'))+'</div></div>';
  html+='<div class="card issue"><div><div class="line">'+(line?esc(line):'مفيش إصدار مستني دلوقتي')+'</div>'+
    '<div class="sub">حالة الإصدار: '+esc(issueState||'—')+(pend.length?' · فيه '+pend.length+' أمر مستني التنفيذ':'')+'</div></div>'+
    '<div class="acts"><button class="btn gold" '+(line?'':'disabled')+' onclick="cmd(\'أصدر\',\'\')">أصدر</button>'+
    '<button class="btn ghost" onclick="exceptional()">إصدار استثنائي</button>'+
    '<button class="btn ghost" onclick="note()">ملاحظة لـ Claude</button></div></div>';
  html+='<h2>طلبات سلة</h2><div class="grid">'+
    stat(count('بانتظار الإصدار'),'بانتظار الإصدار','gold')+
    stat(count('بانتظار تأكيد التحويل'),'تحويل بنكي مستني تأكيد','blue')+
    stat(count('دفع عند الاستلام'),'دفع عند الاستلام','warn')+
    stat(count('اتصدرت'),'اتصدرت ومستنية تتجمع','')+
    stat(count('اتجمعت'),'اتجمعت ومستنية تتبعت','blue')+
    stat(count('اتبعتت'),'اتبعتت','ok')+
    stat(count('استلام من الفرع'),'استلام من الفرع','')+'</div>';
  html+='<h2>طلبات أمازون</h2><div class="grid">'+
    stat(countA('بانتظار الإصدار'),'مستنية شحن','gold')+
    stat(countA('اتصدرت'),'اتصدرت ومستنية تتجمع','')+
    stat(countA('اتجمعت'),'اتجمعت ومستنية تتبعت','blue')+
    stat(countA('اتبعتت'),'اتبعتت','ok')+'</div>';
  html+='<h2>الأرصدة</h2><div class="grid">'+
    stat(money(st('رصيد محفظة الشحن')),'محفظة الشحن · '+dt(stT('رصيد محفظة الشحن')),'')+
    stat(money(st('رصيد المدفوعات')),'المدفوعات · '+dt(stT('رصيد المدفوعات')),'')+
    '<div class="card stat"><div class="n" style="font-size:18px">'+(dt(st('آخر تشغيل لـ Claude'))||'—')+'</div><div class="l">آخر مرة Claude اشتغل</div></div>'+'</div>';
  var transfers=(d.orders||[]).filter(function(o){return !isAmz(o)&&o['المرحلة']==='بانتظار تأكيد التحويل'});
  if(transfers.length){html+='<h2>تحويلات مستنية تأكيد أبو فهد</h2><div class="cards">'+transfers.map(orderCard).join('')+'</div>'}
  var wsec=function(title,list){if(!list.length)return '';var tot=list.reduce(function(s,o){return s+(parseFloat(o['المبلغ'])||0)},0);
    return '<h2>'+title+' ('+list.length+') <small style="font-weight:500;color:var(--muted)">· إجمالي '+money(tot)+'</small></h2><div class="cards">'+list.map(orderCard).join('')+'</div>'};
  html+=wsec('سلة — مستنية الإصدار',(d.orders||[]).filter(function(o){return !isAmz(o)&&o['المرحلة']==='بانتظار الإصدار'}));

/* الملفات: الضغط بيفتح المشاركة (واتساب وغيره)، ولو الجهاز مش بيدعمها بينزل الملف */
var FILES={};
function loadFile(u){if(!FILES[u])FILES[u]=call('getFile',S.token,u).then(function(r){var b=atob(r.b64),n=new Uint8Array(b.length);for(var i=0;i<b.length;i++)n[i]=b.charCodeAt(i);
  return new File([n],r.name,{type:r.mime})}).catch(function(e){delete FILES[u];throw e});return FILES[u]}
function prefetch(){[].slice.call(document.querySelectorAll('a.file[data-u]'),0,6).forEach(function(a){var u=a.getAttribute('data-u');if(u)loadFile(u).then(function(){a.classList.add('ready')}).catch(function(){})})}
function saveFile(f){var url=URL.createObjectURL(f);var x=document.createElement('a');x.href=url;x.download=f.name;document.body.appendChild(x);x.click();x.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000)}
function canShareFile(f){try{return !!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){return false}}
function dl(a){var u=a.getAttribute('data-u');if(!u)return;var t=a.innerHTML;
  var p=loadFile(u),done=false,file=null;p.then(function(f){done=true;file=f}).catch(function(){});
  setTimeout(function(){
    if(done&&file){share(file);return}
    a.innerHTML='بجهّز الملف...';
    p.then(function(f){a.innerHTML=t;a.classList.add('ready');
      if(canShareFile(f)){dlg('<p style="margin-top:0">الملف جاهز: <b>'+esc(f.name)+'</b></p><div class="row"><button class="btn ok" id="shb">ابعت (واتساب)</button><button class="btn ghost" id="svb">نزّله</button></div>');
        $('shb').onclick=function(){closeDlg();share(f)};$('svb').onclick=function(){closeDlg();saveFile(f)}}
      else saveFile(f)})
    .catch(function(e){a.innerHTML=t;toast('مقدرتش أجيب الملف: '+(e.message||e))})},0)}
function share(f){if(canShareFile(f)){navigator.share({files:[f],title:f.name}).catch(function(e){if(e&&e.name!=='AbortError')saveFile(f)})}else{saveFile(f);toast('الجهاز ده مش بيدعم المشاركة، الملف اتنزل')}}

  call('resetPassword',em,$('fcode').value,$('fnew').value).then(function(r){
    if(!r.ok){$('fbtn2').disabled=false;$('ferr2').textContent=r.msg;return}
    closeDlg();S.token=r.token;try{localStorage.setItem('ob_t',r.token);localStorage.setItem('ob_em',em)}catch(e){}toast('كلمة السر اتغيرت');start(r.user)})
  .catch(function(e){$('fbtn2').disabled=false;$('ferr2').textContent='حصلت مشكلة: '+(e.message||e)})}

/* ---------- dialogs ---------- */
function dlg(h){$('dlgBody').innerHTML=h;$('dlg').showModal()}
function closeDlg(){$('dlg').close()}
var _cb=null;
function confirmDlg(t,cb){_cb=cb;dlg('<p style="margin-top:0;line-height:1.7">'+esc(t)+'</p><div class="row"><button class="btn gold" onclick="closeDlg();_cb&&_cb()">تأكيد</button><button class="btn ghost" onclick="closeDlg()">إلغاء</button></div>')}
function openPw(){dlg('<h3 style="margin-top:0">تغيير كلمة السر</h3><label>القديمة</label><input id="op" type="password"><label>الجديدة (6 حروف على الأقل)</label><input id="np" type="password"><div class="err" id="perr"></div>'+
  '<div class="row"><button class="btn" onclick="savePw()">حفظ</button><button class="btn ghost" onclick="closeDlg()">إلغاء</button></div>')}
function savePw(){call('changePassword',S.token,$('op').value,$('np').value).then(function(r){if(!r.ok){$('perr').textContent=r.msg;return}closeDlg();toast('كلمة السر اتغيرت')})}

/* ---------- boot ---------- */
(function(){var t=null;try{t=localStorage.getItem('ob_t');var em=localStorage.getItem('ob_em');if(em)$('em').value=em}catch(e){}
  if(!t)return;
  /* فيه جلسة محفوظة: ماتظهرش شاشة الدخول خالص، اعرض اللوحة وهي بتحمّل */
  S.token=t;$('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('main').innerHTML='<div class="loading">بحمّل...</div>';
  var tries=0;(function boot(){call('getData',t).then(function(d){start(d.user,d)}).catch(function(e){
    if(!S.token)return; /* الجلسة خلصت فعلاً — logout(true) اتنادت */
    if(++tries<4)setTimeout(boot,1500*tries);
    else $('main').innerHTML='<div class="empty">مقدرتش أحمّل: '+esc(e.message||e)+'<br><button class="btn sm" style="margin-top:10px" onclick="location.reload()">جرّب تاني</button></div>'})})();
})();
</script>
</body>
</html>
